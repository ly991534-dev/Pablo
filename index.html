<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تست شمارش معکوس</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    color:#e9edfb;
    font-family:"Vazirmatn",Tahoma,sans-serif;
    direction:rtl;
    background:#070a14;
  }
  .card{
    width:min(560px,94vw);
    padding:30px 22px;
    border-radius:24px;
    background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.09);
    text-align:center;
  }
  .num{
    font-size:clamp(3.5rem,15vw,6rem);
    font-weight:800;
    line-height:1;
    background:linear-gradient(180deg,#fff 10%,#7b6bff 60%,#00d4ff 120%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    font-variant-numeric:tabular-nums;
  }
  .clock{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
  .cell{padding:12px 6px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
  .cell span{display:block;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
  .cell small{display:block;margin-top:4px;font-size:.7rem;color:#8b95b8}
  .debug{
    margin-top:20px;padding:14px;border-radius:14px;
    background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);
    text-align:right;font-size:.75rem;color:#8b95b8;
    font-family:monospace;direction:ltr;line-height:1.8;
  }
</style>
</head>
<body>
<main class="card">
  <h1 style="color:#8b95b8;font-size:1rem;font-weight:600">شمارش معکوس ۱۴۶۵ روز</h1>

  <div class="num" id="days" style="margin-top:16px">—</div>
  <div style="font-size:.9rem;color:#8b95b8;margin-top:4px">روز باقی‌مانده</div>

  <div class="clock">
    <div class="cell"><span id="hours">—</span><small>ساعت</small></div>
    <div class="cell"><span id="minutes">—</span><small>دقیقه</small></div>
    <div class="cell"><span id="seconds">—</span><small>ثانیه</small></div>
  </div>

  <div class="debug" id="debug">در حال بررسی...</div>
</main>

<script>
(function(){
  /* ⚙️ تنظیمات */
  var START_DATE = '2026-09-16T00:00:00';   // ⬅️ امشب/امروز
  var TOTAL_DAYS = 1465;

  var DAY = 86400000;
  var startMs = new Date(START_DATE).getTime();
  var endMs   = startMs + TOTAL_DAYS * DAY;

  function $(id){ return document.getElementById(id); }
  function toFa(s){
    var t='۰۱۲۳۴۵۶۷۸۹', o='';
    s=String(s);
    for(var i=0;i<s.length;i++){
      var c=s.charAt(i);
      o += (c>='0'&&c<='9') ? t[c] : c;
    }
    return o;
  }
  function p2(n){ return n<10 ? '0'+n : ''+n; }

  // نمایش دیباگ
  function showDebug(text){
    $('debug').innerHTML = text;
  }

  function tick(){
    try {
      var now = Date.now();
      var remaining = endMs - now;

      // ---- دیباگ ----
      var dbg = '';
      dbg += 'now:      ' + new Date(now).toString() + '<br>';
      dbg += 'start:    ' + new Date(startMs).toString() + '<br>';
      dbg += 'end:      ' + new Date(endMs).toString() + '<br>';
      dbg += 'remaining: ' + remaining + ' ms<br>';
      dbg += 'days:     ' + (remaining / DAY).toFixed(3) + '<br>';
      showDebug(dbg);

      if (remaining > TOTAL_DAYS * DAY) {
        $('days').textContent = toFa(TOTAL_DAYS);
        $('hours').textContent = '۰۰';
        $('minutes').textContent = '۰۰';
        $('seconds').textContent = '۰۰';
        return;
      }
      if (remaining <= 0) {
        $('days').textContent = '۰';
        $('hours').textContent = '۰۰';
        $('minutes').textContent = '۰۰';
        $('seconds').textContent = '۰۰';
        return;
      }

      var days = Math.ceil(remaining / DAY);
      var rem  = remaining - (days - 1) * DAY - 1;

      $('days').textContent    = toFa(days);
      $('hours').textContent   = toFa(p2(Math.floor(rem / 3600000)));
      $('minutes').textContent = toFa(p2(Math.floor((rem % 3600000) / 60000)));
      $('seconds').textContent = toFa(p2(Math.floor((rem % 60000) / 1000)));

    } catch(e) {
      showDebug('ERROR: ' + e.message);
    }
  }

  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
