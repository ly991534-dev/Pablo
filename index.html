<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>شمارش معکوس ۱۴۶۵ روز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --fg:#e9edfb;
    --muted:#8b95b8;
    --c1:#7b6bff;
    --c2:#00d4ff;
  }
  html,body{height:100%}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
    color:var(--fg);
    font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;
    direction:rtl;
    background:
      radial-gradient(900px 620px at 12% -12%, rgba(123,107,255,.38), transparent 62%),
      radial-gradient(820px 620px at 92% 112%, rgba(0,212,255,.24), transparent 62%),
      #070a14;
    background-attachment:fixed;
  }

  .card{
    width:min(560px,94vw);
    padding:34px 26px 26px;
    border-radius:30px;
    background:linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 30px 80px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    text-align:center;
  }

  .badge{
    display:inline-block;
    padding:6px 16px;
    border-radius:999px;
    font-size:.75rem;
    letter-spacing:.5px;
    color:#cdd6ff;
    background:rgba(123,107,255,.16);
    border:1px solid rgba(123,107,255,.35);
  }

  h1{
    margin-top:14px;
    font-size:1.15rem;
    font-weight:600;
    color:var(--muted);
  }

  .big{margin:26px 0 22px}

  .num{
    font-size:clamp(4rem,17vw,7rem);
    font-weight:800;
    line-height:1;
    background:linear-gradient(180deg,#ffffff 10%, var(--c1) 60%, var(--c2) 120%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 34px rgba(123,107,255,.45));
    display:inline-block;
    font-variant-numeric:tabular-nums;
  }

  .num.pulse{animation:pulse .55s ease}
  @keyframes pulse{
    0%{transform:scale(1)}
    40%{transform:scale(1.07)}
    100%{transform:scale(1)}
  }

  .unit-word{
    margin-top:6px;
    font-size:.95rem;
    color:var(--muted);
  }

  .clock{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }

  .cell{
    padding:14px 6px;
    border-radius:18px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.07);
  }

  .cell span{
    display:block;
    font-size:1.6rem;
    font-weight:800;
    font-variant-numeric:tabular-nums;
    letter-spacing:1px;
  }

  .cell small{
    display:block;
    margin-top:4px;
    font-size:.72rem;
    color:var(--muted);
  }

  .progress{
    margin-top:24px;
    height:9px;
    border-radius:999px;
    background:rgba(255,255,255,.07);
    overflow:hidden;
  }

  .bar{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,var(--c1),var(--c2));
    box-shadow:0 0 18px rgba(0,212,255,.6);
    transition:width .6s ease;
  }

  .foot{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:.8rem;
    color:var(--muted);
  }

  .start-info{
    margin-top:20px;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,.08);
    font-size:.75rem;
    color:var(--muted);
  }

  .start-info strong{
    color:#c7cfff;
    font-weight:600;
  }
</style>
</head>
<body>

<main class="card">
  <div class="badge">شمارش معکوس</div>
  <h1>۱۴۶۵ روز</h1>

  <div class="big">
    <div class="num" id="days">۱۴۶۵</div>
    <div class="unit-word">روز باقی‌مانده</div>
  </div>

  <div class="clock">
    <div class="cell"><span id="hours">۰۰</span><small>ساعت</small></div>
    <div class="cell"><span id="minutes">۰۰</span><small>دقیقه</small></div>
    <div class="cell"><span id="seconds">۰۰</span><small>ثانیه</small></div>
  </div>

  <div class="progress"><div class="bar" i

d="bar"></div></div>
  <div class="foot">
    <span id="elapsed">۰ روز سپری شده</span>
    <span id="percent">۰٪</span>
  </div>

  <div class="start-info">
    تاریخ شروع: <strong id="start-date">—</strong>
  </div>
</main>

<script>
(function(){
  /* ============================================================
     ⚙️ تنظیمات
     ============================================================
     تاریخ و ساعت شروع شمارش (به وقت محلی مرورگر).
     فرمت:  'YYYY-MM-DDTHH:MM:SS'
     ============================================================ /
  var START_DATE = '2026-09-17T00:00:00';
  var TOTAL_DAYS = 1465;

  / ============================================================
     از این پایین چیزی را تغییر ندهید مگر بدانید چه می‌کنید
     ============================================================ /
  var DAY   = 86400000;
  var start = new Date(START_DATE).getTime();
  var end   = start + TOTAL_DAYS  DAY;

  function $(id){ return document.getElementById(id); }

  function toFa(str){
    var t = '۰۱۲۳۴۵۶۷۸۹', out = '';
    str = String(str);
    for (var i = 0; i < str.length; i++){
      var c = str.charAt(i);
      out += (c >= '0' && c <= '9') ? t[c] : c;
    }
    return out;
  }

  function pad2(n){
    return n < 10 ? '0' + n : '' + n;
  }

  // نمایش تاریخ شروع به فارسی
  function showStartDate(){
    try {
      var d = new Date(START_DATE);
      var opts = { year:'numeric', month:'long', day:'numeric',
                   hour:'2-digit', minute:'2-digit' };
      var s = d.toLocaleDateString('fa-IR', opts);
      $('start-date').textContent = s;
    } catch(e){
      $('start-date').textContent = START_DATE;
    }
  }

  var lastDays = null;

  function tick() {
    var remaining = end - Date.now();

    // اگر هنوز به تاریخ شروع نرسیده‌ایم
    if (remaining > TOTAL_DAYS  DAY) {
      $('days').textContent    = toFa(TOTAL_DAYS);
      $('hours').textContent   = '۰۰';
      $('minutes').textContent = '۰۰';
      $('seconds').textContent = '۰۰';
      $('bar').style.width     = '0%';
      $('elapsed').textContent = 'هنوز شروع نشده';
      $('percent').textContent = '۰٪';
      return;
    }

    // اگر شمارش تمام شده باشد
    if (remaining <= 0) {
      $('days').textContent    = '۰';
      $('hours').textContent   = '۰۰';
      $('minutes').textContent = '۰۰';
      $('seconds').textContent = '۰۰';
      $('bar').style.width     = '100%';
      $('elapsed').textContent = '۱۴۶۵ روز کامل شد';
      $('percent').textContent = '۱۰۰٪';
      return;
    }

    var days = Math.ceil(remaining / DAY);
    var rem  = remaining - (days - 1)  DAY - 1;

    var h = Math.floor(rem / 3600000);
    var m = Math.floor((rem % 3600000) / 60000);
    var s = Math.floor((rem % 60000) / 1000);

    $('days').textContent    = toFa(days);
    $('hours').textContent   = toFa(pad2(h));
    $('minutes').textContent = toFa(pad2(m));
    $('seconds').textContent = toFa(pad2(s));

    if (days !== lastDays) {
      lastDays = days;
      var el = $('days');
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
    }

    var totalMs = TOTAL_DAYS  DAY;
    var elapsed = totalMs - remaining;
    var percent = (elapsed / totalMs)  100;

    $('bar').style.width     = percent.toFixed(2) + '%';
    $('elapsed').textContent = toFa(TOTAL_DAYS - days) + ' روز سپری شده';
    $('percent').textContent = toFa(Math.floor(percent)) + '٪';
  }

  showStartDate();
  tick();
  setInterval(tick, 1000);
})();
</script>

</body>
</html>
